plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// --- 固定签名：CI 里由 Workflow 根据 Secrets 生成 android/app/keystore.properties ---
// 没有该文件时（普通本地构建）自动退回 Android 默认 debug 签名，构建不会失败。
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProperties.load(it) }
}
def hasFixedKeystore = keystoreProperties['storeFile'] != null && keystoreProperties['storeFile'] != ''

// --- FileProvider 需要 androidx.core ---
android {
    namespace 'com.quicksend.android'
    compileSdk 34

    // AGP 8.x 要求显式开启 buildConfig 才能用 buildConfigField
    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "com.quicksend.android"
        minSdk 24
        targetSdk 34
        // CI: GITHUB_RUN_NUMBER (int). Local: default 1
        def runNum = (System.getenv("GITHUB_RUN_NUMBER") != null) ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) : 1
        versionCode runNum
        versionName "1.0.8"
        // Expose as buildConfigField so Java can read it
        buildConfigField "int", "BUILD_NUMBER", String.valueOf(runNum)

        ndk {
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        // debug：CI 提供了固定 keystore 才覆盖，否则沿用 Android 默认 debug 签名
        // （固定后新版 APK 可以直接覆盖安装旧版，不会因签名不同安装失败）
        if (hasFixedKeystore) {
            debug {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType keystoreProperties['storeType'] ?: 'pkcs12'
            }
            release {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeType keystoreProperties['storeType'] ?: 'pkcs12'
            }
        }
    }

    sourceSets {
        main {
            // 后端 Flask 源码由 syncPythonSources 复制到构建目录，避免把 uploads 等体积内容打进 APK
            python.srcDirs = ['src/main/python', layout.buildDirectory.dir('generated/qpython').get().asFile]
            // 前端静态资源由 syncStaticAssets 同步到构建目录
            assets.srcDirs += [layout.buildDirectory.dir('generated/qassets').get().asFile]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // findByName 返回 null（安全），getByName 才会抛异常
            def releaseSigning = signingConfigs.findByName('release')
            if (releaseSigning != null) {
                signingConfig = releaseSigning
            }
            // releaseSigning 为 null 时 Gradle 自动不签名（debug 默认签）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        // 与 CI 上可用的 Python 3.10 保持一致（Chaquopy 要求构建用版本与目标版本相同）
        version = "3.10"
        buildPython "python3.10"
        pip {
            install 'flask==3.0.3'
        }
    }
}

// androidx.core (FileProvider)
dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    // 客户端模式扫码连接（不依赖 GMS）
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}

def qassetsDir = layout.buildDirectory.dir('generated/qassets').get().asFile
def qpythonDir = layout.buildDirectory.dir('generated/qpython').get().asFile

tasks.register('syncStaticAssets', Sync) {
    from('../../quicksend/static') {
        include 'dist/**'
        include 'fonts/**'
        include 'favicon.ico'
        include 'favicon.png'
        include 'index.build.html'
        include 'script.js'
    }
    into new File(qassetsDir, 'static')
}

tasks.register('syncPythonSources', Sync) {
    from('../../quicksend') {
        include 'app.py'
        include 'analytics.py'
    }
    into qpythonDir
}

tasks.named('preBuild').configure {
    dependsOn 'syncStaticAssets', 'syncPythonSources'
}

// 显式声明依赖，避免 Gradle 8 报 "uses this output without declaring a dependency"
tasks.configureEach { t ->
    if (t.name.startsWith('merge') && t.name.endsWith('PythonSources')) {
        t.dependsOn 'syncPythonSources'
    }
    if (t.name.startsWith('merge') && t.name.endsWith('Assets')) {
        t.dependsOn 'syncStaticAssets'
    }
}
