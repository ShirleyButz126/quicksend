name: Build APK

on:
  push:
    branches: [chaquopy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: quicksend/static/package-lock.json

      - name: Build frontend
        run: |
          cd quicksend/static
          npm ci --prefer-offline 2>&1 | tail -5 || npm install 2>&1 | tail -5
          npm run build 2>&1 | tail -10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show python
        run: |
          python3 --version
          which python3.10 || true

      - name: Prepare fixed signing key
        env:
          KS_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_B64_ALT: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STOREPWD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KS_STOREPWD_ALT: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KS_ALIAS_ALT: ${{ secrets.KEY_ALIAS }}
          KS_KEYPWD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KS_KEYPWD_ALT: ${{ secrets.KEY_PASSWORD }}
        run: |
          BASE64_VALUE="${KS_B64:-$KS_B64_ALT}"
          STORE_PASSWORD="${KS_STOREPWD:-$KS_STOREPWD_ALT}"
          ALIAS_VALUE="${KS_ALIAS:-$KS_ALIAS_ALT}"
          KEYPWD_VALUE="${KS_KEYPWD:-$KS_KEYPWD_ALT}"
          if [ -z "$BASE64_VALUE" ]; then
            echo "未找到 RELEASE_KEYSTORE_BASE64 / KEYSTORE_BASE64，沿用默认 debug 签名（签名会随每次构建变化）"
            exit 0
          fi
          echo "$BASE64_VALUE" | base64 -d > android/app/fixed-debug.keystore
          {
            echo "storeFile=fixed-debug.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$ALIAS_VALUE"
            echo "keyPassword=$KEYPWD_VALUE"
            echo "storeType=pkcs12"
          } > android/app/keystore.properties
          ls -l android/app/fixed-debug.keystore
          # 提前校验 keystore 是否可用，避免到 gradle 里才报错
          keytool -list -keystore android/app/fixed-debug.keystore -storepass "$STORE_PASSWORD" | head -5

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QuickSend APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
