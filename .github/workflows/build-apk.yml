name: Build APK

on:
  push:
    branches: [chaquopy, main, master, apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    # 顶层 env 让 secrets 稳定传递到所有 step
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show python
        run: |
          python3 --version
          which python3.10

      - name: Unpack sources
        run: |
          mkdir -p src
          unzip -o build-src2.zip -d src
          find src -maxdepth 3 -type d

      # --- Release keystore 注入 ---
      # 无条件跑，但脚本内判断 RELEASE_KEYSTORE_BASE64 是否为空
      - name: Inject release keystore
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            mkdir -p src/android/app
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > src/android/app/release-key.jks
            cat > src/android/app/keystore.properties <<EOF
storeFile=release-key.jks
storeType=pkcs12
storePassword=$RELEASE_STORE_PASSWORD
keyAlias=$RELEASE_KEY_ALIAS
keyPassword=$RELEASE_KEY_PASSWORD
EOF
            ls -la src/android/app/release-key.jks src/android/app/keystore.properties
            echo "Keystore injected ✅"
          else
            echo "RELEASE_KEYSTORE_BASE64 is empty, skipping release signing ℹ️"
          fi

      # --- Debug 构建（始终跑） ---
      - name: Build debug APK
        run: gradle -p src/android assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-debug-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # --- Release 构建（用 env 变量判断更可靠） ---
      - name: Build release APK
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        run: gradle -p src/android assembleRelease --no-daemon --stacktrace

      - name: Upload release APK artifact
        if: env.RELEASE_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-release-apk
          path: src/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # --- 发布到 Release ---
      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QuickSend APK ${{ github.run_number }}
          files: |
            src/android/app/build/outputs/apk/debug/*.apk
            src/android/app/build/outputs/apk/release/*.apk
          body: |
            **Debug APK**: 可直接装到测试手机
            **Release APK**: 正式签名（如果已配置 keystore）
            
            构建分支: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
