name: Build APK

on:
  push:
    branches: [chaquopy, main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show python
        run: |
          python3 --version
          which python3.10

      - name: Unpack sources
        run: |
          mkdir -p src
          unzip -o build-src2.zip -d src
          find src -maxdepth 3 -type d

      - name: Build debug APK
        run: gradle -p src/android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-apk
          path: src/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QuickSend APK ${{ github.run_number }}
          files: src/android/app/build/outputs/apk/debug/*.apk
