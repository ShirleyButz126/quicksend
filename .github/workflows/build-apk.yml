name: Build APK

on:
  push:
    branches: [chaquopy]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: quicksend/static/package-lock.json

      - name: Build frontend
        run: |
          cd quicksend/static
          npm ci --prefer-offline 2>&1 | tail -5 || npm install 2>&1 | tail -5
          npm run build 2>&1 | tail -10

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show python
        run: |
          python3 --version
          which python3.10 || true

      - name: Build debug APK
        run: gradle -p android assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish APK to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QuickSend APK ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/*.apk
