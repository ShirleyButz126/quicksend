name: Build APK (Buildozer)

on:
  push:
    branches: [chaquopy, main, master, apk-release]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            build-essential git python3-pip python3-dev zip unzip \
            openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev \
            libncurses5-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev \
            libsdl2-mixer-dev libgl-dev libglu1-mesa-dev libgles2-mesa-dev \
            x11proto-core-dev xauth xvfb cmake || echo "some deps skipped"

      - name: Install buildozer + cython
        run: |
          pip3 install --upgrade pip
          pip3 install buildozer cython
          buildozer version

      - name: Cache Android SDK
        uses: actions/cache@v4
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-v1-${{ runner.os }}

      - name: Cache buildozer build
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android
            ~/.buildozer/cache
            ~/.buildozer/downloads
          key: buildozer-v1-${{ runner.os }}

      - name: Accept Android licenses
        run: |
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

      - name: Build APK with buildozer
        run: |
          cd quicksend
          # yes 自动接受首次初始化的确认提示
          # xvfb-run 提供虚拟 X display（Kivy 在后台也需要）
          timeout 600 bash -c "yes | xvfb-run -a buildozer android debug --verbose" || echo "buildozer timed out or failed"

      - name: Locate APK
        id: locate
        run: |
          # buildozer 产物路径（多架构时会有多个 build-* 目录）
          RESULT=$(find ~/.buildozer -name '*.apk' -type f 2>/dev/null | head -1)
          echo "APK found: $RESULT"
          if [ -n "$RESULT" ]; then
            echo "apk_path=$RESULT" >> $GITHUB_OUTPUT
          else
            echo "ERROR: no APK found"
            find ~/.buildozer -type d 2>/dev/null | head -30
            ls -la ~/.buildozer/ 2>/dev/null
          fi

      - name: Upload APK artifact
        if: steps.locate.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: quicksend-debug-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Publish to Release
        if: steps.locate.outputs.apk_path != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: QuickSend APK ${{ github.run_number }} (Buildozer)
          files: ${{ steps.locate.outputs.apk_path }}
          body: |
            **构建方式**: buildozer + python-for-android + Kivy（老方案，已验证能跑）
            
            分支: ${{ github.head_ref }}
            Commit: ${{ github.sha }}
