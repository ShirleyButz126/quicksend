name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'quicksend/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装系统依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential python3 python3-dev python3-pip \
          python3-venv python3-wheel zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev

    - name: 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Buildozer + Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==3.0.11

    - name: 预装 Android SDK + 接受 License
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        mkdir -p $ANDROID_HOME/cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        # 接受所有 license（同时兼容旧版和新版 license 格式）
        yes | sdkmanager --licenses || true

        # 装 Buildozer buildozer.spec 指定的 API 33 + 对应的 build-tools
        sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.2.9519653"

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
        echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

    - name: Buildozer 构建 APK
      working-directory: quicksend
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        export JAVA_HOME=$JAVA_HOME

        # 清理旧缓存
        rm -rf ~/.buildozer

        # 构建
        buildozer android debug 2>&1 | tail -300

        echo ""
        echo "=== 查找 APK ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la bin/ 2>/dev/null || echo "(bin 目录不存在)"

    - name: 全局查找 APK
      run: |
        echo "=== Globing for APKs in workspace ==="
        find $HOME -name "*.apk" -type f 2>/dev/null | head -20
        echo "=== buildozer bin dirs ==="
        find $HOME/.buildozer -type d -name "bin" 2>/dev/null | head -10

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: QuickSend-APK
        path: |
          bin/*.apk
          $HOME/.buildozer/android/platform/build/**/*.apk
          $HOME/.buildozer/android/app/bin/*.apk
        if-no-files-found: warn
