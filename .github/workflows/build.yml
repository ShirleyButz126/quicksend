name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'quicksend/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装系统依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential python3 python3-dev python3-pip \
          python3-venv python3-wheel zip unzip openjdk-17-jdk \
          autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev

    - name: 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Buildozer + Cython
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==3.0.11

    - name: Buildozer 构建 APK
      working-directory: quicksend
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        export JAVA_HOME=$JAVA_HOME

        # 第 1 轮：让 Buildozer 初始化 SDK 目录结构 + 声明需要的 build-tools 版本
        # 会失败（aidl 找不到），但 SDK 目录会被创建
        rm -rf ~/.buildozer
        set +e
        buildozer android debug 2>&1 | tail -50
        set -e

        # 第 2 轮：接受 Buildozer 自己 SDK 目录下的所有 license
        SDKMAN=$HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager
        if [ -z "$SDKMAN" ] || [ ! -x "$SDKMAN" ]; then
          SDKMAN=$(find $HOME/.buildozer -name sdkmanager -type f 2>/dev/null | head -1)
        fi
        echo "Using sdkmanager: $SDKMAN"
        if [ -n "$SDKMAN" ]; then
          yes | $SDKMAN --licenses 2>/dev/null || true
          # 直接强制安装 build-tools 37（Buildozer 硬要的）
          yes | $SDKMAN "build-tools;37.0.0" 2>&1 | tail -20 || true
          # 确保 aidl 真在那里
          ls -la $HOME/.buildozer/android/platform/android-sdk/build-tools/ 2>/dev/null || echo "NO build-tools dir!"
        fi

        # 第 3 轮：正式构建
        buildozer android debug 2>&1 | tail -200

        echo ""
        echo "=== 查找 APK ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la bin/ 2>/dev/null || echo "(bin 目录不存在)"

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: QuickSend-APK
        path: |
          bin/*.apk
          $HOME/.buildozer/android/platform/build/**/*.apk
          $HOME/.buildozer/android/app/bin/*.apk
        if-no-files-found: error
