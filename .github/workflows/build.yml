name: Build APK

on:
  push:
    branches: [main, master]
    paths:
      - 'quicksend/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 安装系统依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential python3 python3-dev python3-pip \
          python3-venv python3-wheel zip unzip openjdk-17-jdk \
          autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev \
          libncursesw5-dev cmake libffi-dev libssl-dev gettext

    - name: 配置 Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: 设置 Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安装 Buildozer + Cython + python-for-android
      run: |
        pip install --upgrade pip setuptools wheel
        pip install buildozer==1.5.0 cython==3.0.11 python-for-android==2024.1.21

    - name: 预装 Android SDK + 接受所有 License
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        mkdir -p $ANDROID_HOME/cmdline-tools $ANDROID_HOME/platform-tools
        mkdir -p ~/.android

        # 下载 cmdline-tools
        cd /tmp
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip
        unzip -q commandlinetools-linux-10406996_latest.zip -d $ANDROID_HOME/cmdline-tools
        mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest

        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

        # 方式 1：传统 yes | sdkmanager --licenses
        yes | sdkmanager --licenses 2>&1 | tail -5 || true

        # 方式 2：写 accepted licenses 文件（Buildozer 旧版 sdkmanager 用这个）
        mkdir -p $ANDROID_HOME/licenses
        echo -e "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_HOME/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_HOME/licenses/android-sdk-preview-license

        # 方式 3：写 repositories.cfg 跳过 license 检查
        echo "### User Sources for Android SDK Manager" > ~/.android/repositories.cfg

        # 装 Build-Tools 37（Buildozer 1.5.0 硬要这个版本）
        yes | sdkmanager "build-tools;37.0.0" "platform-tools" "platforms;android-33" "ndk;24.0.8215888" 2>&1 | tail -5

        # 软链 Buildozer 期望的 NDK r28c → 我们的 r24（Kivy 2.3.0 兼容 NDK 24，不兼容 25+）
        mkdir -p ~/.buildozer/android/platform
        rm -rf ~/.buildozer/android/platform/android-ndk-r28c 2>/dev/null || true
        ln -sf $ANDROID_HOME/ndk/24.0.8215888 ~/.buildozer/android/platform/android-ndk-r28c

        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
        echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH

        echo "=== SDK 验证 ==="
        ls $ANDROID_HOME/build-tools/
        ls $ANDROID_HOME/build-tools/37.0.0/aidl 2>/dev/null && echo "aidl OK!" || echo "aidl MISSING!"

    - name: Buildozer 构建 APK
      working-directory: quicksend
      run: |
        export ANDROID_HOME=$HOME/Android/Sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
        export JAVA_HOME=$JAVA_HOME

        set +e
        buildozer android debug 2>&1 | tee /tmp/buildozer.log | tail -300
        BUILD_EXIT=$?
        set -e

        echo ""
        echo "=== BUILD EXIT CODE: $BUILD_EXIT ==="
        echo "=== 关键错误行 ==="
        grep -iE "(error:|FAILED|Command failed|undefined macro|syntax error|configure\.ac|autoreconf)" /tmp/buildozer.log 2>/dev/null | tail -30 || true

        echo ""
        echo "=== 查找 APK ==="
        find $HOME -name "*.apk" -type f 2>/dev/null
        ls -la bin/ 2>/dev/null || echo "(bin 目录不存在)"

        # 如果构建挂了，把完整日志保存为 artifact 方便排查
        echo ""
        echo "=== 完整日志长度 ==="
        wc -l /tmp/buildozer.log 2>/dev/null || echo "no log"

    - name: 上传 APK
      uses: actions/upload-artifact@v4
      with:
        name: QuickSend-APK
        path: |
          bin/*.apk
          $HOME/.buildozer/android/platform/build/**/*.apk
          $HOME/.buildozer/android/app/bin/*.apk
        if-no-files-found: error
